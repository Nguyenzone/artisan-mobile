name: artisan_mobile
description: "Artisan Mobile - ứng dụng ghi và điều khiển mẻ rang cà phê qua Modbus TCP, tương thích file .alog của Artisan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  file_picker: ^13.3.1
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/profiles/
