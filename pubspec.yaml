name: artisan_mobile
description: "Artisan Mobile - ứng dụng ghi và điều khiển mẻ rang cà phê qua Modbus TCP, tương thích file .alog của Artisan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  file_picker: ^13.3.1
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/profiles/
    - assets/icon/

# Biểu tượng ứng dụng (tạo bằng: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#12382A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
